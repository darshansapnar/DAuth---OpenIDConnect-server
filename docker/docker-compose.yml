version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dauth-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dauth
    ports:
      - '5432:5432'
    volumes:
      - dauth_postgres_data:/var/lib/postgresql/data

volumes:
  dauth_postgres_data:
    driver: local
